<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>宿泊のしおり / House Guide</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

<script>
/* =======================================================================
   ここだけ書き換えれば、しおりが完成します。
   ・{ja:"日本語", en:"English"} は 日本語 と 英語 の2つを書きます
   ・書けていない所は「（ここを書き換えてください）」のままでOK（後で直せます）
   ・文の途中で改行したいときは <br> と書きます
   ======================================================================= */
const SHIORI = {

  // 表示する言語の初期値。"ja"（日本語から表示）か "en"（英語から表示）
  defaultLang: "ja",

  // 施設名（宿の名前）
  name: { ja: "KASUMI-an（カスミアン）", en: "KASUMI-an" },

  // キャッチ（宿のひとこと紹介。1〜2行）
  tagline: {
    ja: "熊本市内と阿蘇のあいだ、1日1組かぎりの一棟貸し。<br>3室・最大17名・朝食つき。",
    en: "A whole house for one group per day, between Kumamoto City and Mt. Aso.<br>3 rooms, up to 17 guests, breakfast included."
  },

  // 住所
  address: {
    // 日本語表記＝タクシー運転手に見せる用。番地まで正確に。
    ja: "熊本県熊本市中央区帯山7丁目（ここを書き換えてください：番地・建物名）",
    // 英語表記＝海外ゲストが控える用
    en: "7-chome Obiyama, Chuo-ku, Kumamoto City, Kumamoto (edit here: street number)"
  },

  // 地図のピンを立てる場所。Googleマップで宿を右クリック→出てくる2つの数字をコピー
  // ↓ 今は「帯山あたり」のおおよその値です。必ず正確な場所に直してください
  lat: 32.7980,
  lng: 130.7460,

  // チェックイン・チェックアウトの時刻
  checkIn:  "15:00",
  checkOut: "10:00",

  // 鍵の受け取り方法（キーボックスの場所と暗証番号、手渡しなど）
  keyPickup: {
    ja: "（ここを書き換えてください：例）玄関右手のキーボックスに入っています。暗証番号は 0000 です。",
    en: "(edit here, e.g.) The key is in the keybox to the right of the entrance. The code is 0000."
  },

  // Wi-Fi。ゲストがいちばん最初に見るところです
  wifi: {
    ssid: "（ここを書き換えてください）",
    password: "（ここを書き換えてください）",
    note: {
      ja: "パスワードは右のボタンでコピーできます。",
      en: "Tap the button to copy the password."
    }
  },

  // ハウスルール（守ってほしいこと）。行を増やしたい時は { } のかたまりをコピーして足す
  houseRules: [
    { ja: "禁煙です。喫煙は屋外の指定場所でお願いします。", en: "No smoking indoors. Please smoke outside in the designated area." },
    { ja: "夜22時以降はお静かに。近隣にお住まいの方がいます。", en: "Please keep quiet after 22:00 — there are neighbors nearby." },
    { ja: "1日1組限定です。宿泊人数以外の方の立ち入りはご遠慮ください。", en: "One group per day. Please do not invite additional visitors." },
    { ja: "駐車場は8台まで停められます。（ここを書き換えてください：停める位置の説明）", en: "Parking for up to 8 cars. (edit here: where to park)" }
  ],

  // ゴミの出し方
  trash: {
    ja: "（ここを書き換えてください：例）燃えるゴミは台所の青い袋へ、缶・びん・ペットボトルは勝手口の箱へ分けてください。袋は縛って、そのまま置いていって大丈夫です。",
    en: "(edit here, e.g.) Burnable waste goes in the blue bag in the kitchen; cans, bottles and PET bottles go in the box by the back door. Tie the bags and just leave them — we'll take care of the rest."
  },

  // 設備の使い方（エアコン・お風呂・キッチンなど）
  // icon は絵文字。title が見出し、body が説明です
  facilities: [
    { icon: "❄️", title: { ja: "エアコン", en: "Air conditioner" },
      body:  { ja: "（ここを書き換えてください：リモコンの場所と使い方）", en: "(edit here: where the remote is and how to use it)" } },
    { icon: "🛁", title: { ja: "お風呂・シャワー", en: "Bath & shower" },
      body:  { ja: "（ここを書き換えてください：給湯の操作、お湯が出るまでの時間など）", en: "(edit here: how to turn on the hot water, how long it takes)" } },
    { icon: "🍳", title: { ja: "キッチン", en: "Kitchen" },
      body:  { ja: "（ここを書き換えてください：使ってよい調理器具・調味料、IH/ガスの操作）", en: "(edit here: what you may use, how the stove works)" } },
    { icon: "🌅", title: { ja: "朝ごはん", en: "Breakfast" },
      body:  { ja: "朝食つきです。（ここを書き換えてください：時間と場所）", en: "Breakfast is included. (edit here: time and place)" } },
    { icon: "🅿️", title: { ja: "駐車場", en: "Parking" },
      body:  { ja: "8台まで無料で停められます。", en: "Free parking for up to 8 cars." } }
  ],

  // 周辺のおすすめ（お店・コンビニ・温泉など）。{ } のかたまりをコピーして増やせます
  // walk … 徒歩の分数（例: 5）。空 "" にすると分数のバッジは出ません
  // mapUrl … 空 "" のままでも、店名で地図を検索するリンクになります
  nearby: [
    { name: { ja: "（ここを書き換えてください：お店の名前）", en: "(edit here: place name)" },
      walk: "",
      comment: { ja: "（ひとこと：何がおいしいか・何ができるか）", en: "(one line: what's good there)" },
      mapUrl: "" }
  ],

  // 緊急連絡先。119 と 110 は日本の共通番号なのでそのままでOKです
  emergency: {
    ownerName:  { ja: "吉川 香寿美（オーナー）", en: "Kazumi Yoshikawa (host)" },
    ownerPhone: "（ここを書き換えてください：電話番号）",
    hospital: {
      name:  { ja: "（ここを書き換えてください：最寄りの病院名）", en: "(edit here: nearest hospital)" },
      phone: "（ここを書き換えてください：電話番号）"
    }
  },

  // チェックアウト時のお願い
  checkout: [
    { ja: "エアコン・照明・給湯器を消してください。", en: "Please turn off the air conditioner, lights and water heater." },
    { ja: "使った食器は洗って、元の場所に戻してください。", en: "Please wash the dishes and put them back." },
    { ja: "ゴミは上の分け方でまとめて置いていってください。", en: "Please sort the trash as described above and leave it inside." },
    { ja: "鍵は元のキーボックスに戻して、窓の施錠を確認してください。", en: "Return the key to the keybox and check that the windows are locked." }
  ],

  // 最後のひとこと
  farewell: {
    ja: "またお会いできるのを楽しみにしています。",
    en: "We hope to see you again."
  }
};

/* --- ここから下は、ふつうは触らなくて大丈夫です --- */
const LABELS = {
  wifi:      { ja: "Wi-Fi", en: "Wi-Fi" },
  ssid:      { ja: "ネットワーク名", en: "Network (SSID)" },
  password:  { ja: "パスワード", en: "Password" },
  access:    { ja: "住所・行き方", en: "Address & access" },
  taxi:      { ja: "🚕 タクシーの運転手さんに見せてください", en: "🚕 Show this to a taxi driver" },
  gmaps:     { ja: "🧭 Googleマップで開く", en: "🧭 Open in Google Maps" },
  map:       { ja: "地図", en: "Map" },
  stay:      { ja: "チェックイン・チェックアウト", en: "Check-in & check-out" },
  checkIn:   { ja: "チェックイン", en: "Check-in" },
  checkOut:  { ja: "チェックアウト", en: "Check-out" },
  key:       { ja: "鍵の受け取り", en: "Getting the key" },
  rules:     { ja: "ハウスルール", en: "House rules" },
  facilities:{ ja: "設備の使い方", en: "How things work" },
  trash:     { ja: "ゴミの出し方", en: "Trash" },
  nearby:    { ja: "この辺のおすすめ", en: "Around here" },
  emergency: { ja: "緊急連絡先", en: "Emergency contacts" },
  fire:      { ja: "救急・消防", en: "Ambulance / Fire" },
  police:    { ja: "警察", en: "Police" },
  hospital:  { ja: "最寄りの病院", en: "Nearest hospital" },
  checkout:  { ja: "チェックアウトのお願い", en: "Before you leave" },
  copy:      { ja: "コピー", en: "Copy" },
  copied:    { ja: "コピーしました", en: "Copied" },
  walkMin:   { ja: "徒歩", en: "walk" },
  minSuffix: { ja: "分", en: " min" },
  openMap:   { ja: "地図", en: "Map" }
};
</script>

<style>
  :root{
    --bg:#fbf9f4; --card:#ffffff; --ink:#2b2320; --muted:#7a6f68;
    --accent:#2e7d6b; --accent-soft:#e3f1ec; --line:#e9e2d8; --warn:#c0442a;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Hiragino Sans","Noto Sans JP",sans-serif;
    font-size:17px; line-height:1.7; -webkit-text-size-adjust:100%;
    /* 日本語は語中で切らず、句読点だけが行頭に落ちないようにする */
    word-break:normal; overflow-wrap:normal; line-break:strict;
  }
  .wrap{max-width:560px; margin:0 auto; padding:0 18px 56px;}
  header{
    position:relative; text-align:center; padding:40px 18px 26px;
    background:linear-gradient(180deg,var(--accent-soft),var(--bg));
    border-bottom:1px solid var(--line); margin-bottom:22px;
  }
  .langs{
    position:absolute; top:10px; right:10px; display:flex; gap:4px;
    background:rgba(255,255,255,.8); border:1px solid var(--line);
    border-radius:999px; padding:3px;
  }
  .langs button{
    font:inherit; font-size:.8rem; font-weight:700; line-height:1;
    min-height:38px; padding:6px 14px; border:none; border-radius:999px;
    background:transparent; color:var(--muted); cursor:pointer;
  }
  .langs button[aria-pressed="true"]{background:var(--accent); color:#fff;}
  .kicker{font-size:.8rem; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:700; margin:0 0 8px;}
  h1{font-size:2rem; margin:0 0 10px; line-height:1.25;}
  header .tagline{margin:0; color:var(--muted); font-size:.98rem;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:20px 18px; margin:0 0 18px; box-shadow:0 2px 10px rgba(80,60,30,.05);
  }
  .card h2{font-size:1.05rem; margin:0 0 14px; display:flex; align-items:center; gap:9px;}
  .card h2 .ic{font-size:1.3rem;}
  .card.hero{border-color:var(--accent); border-width:2px;}
  .kv{padding:12px 0; border-top:1px solid var(--line);}
  .kv:first-of-type{border-top:none; padding-top:0;}
  .kv .k{display:block; font-size:.84rem; color:var(--muted); font-weight:700; margin-bottom:3px;}
  .kv .row{display:flex; align-items:center; gap:10px;}
  .kv .v{flex:1; font-size:1.15rem; font-weight:700; letter-spacing:.01em; overflow-wrap:anywhere;}
  .copy{
    flex:none; min-height:44px; min-width:44px; padding:0 14px;
    font:inherit; font-size:.86rem; font-weight:700; cursor:pointer;
    background:var(--accent-soft); color:var(--accent);
    border:1px solid var(--accent); border-radius:10px;
  }
  .copy.done{background:var(--accent); color:#fff;}
  .times{display:flex; gap:12px;}
  .time{flex:1; text-align:center; background:var(--accent-soft); border-radius:12px; padding:12px 8px;}
  .time .lbl{font-size:.8rem; color:var(--accent); font-weight:700; margin:0;}
  .time .val{font-size:1.5rem; font-weight:700; margin:2px 0 0;}
  .addr-en{font-size:1.1rem; font-weight:700; margin:0 0 12px;}
  .taxi{background:var(--accent-soft); border-radius:12px; padding:13px 14px; margin:0;}
  .taxi .lbl{font-size:.8rem; font-weight:700; color:var(--accent); margin:0 0 6px;}
  .taxi .row{display:flex; align-items:center; gap:10px;}
  .addr-ja{font-size:1.15rem; font-weight:700; margin:0; line-height:1.5; flex:1;}
  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; min-height:52px; text-decoration:none; text-align:center; font-weight:700;
    padding:14px 16px; border-radius:12px; margin-top:14px; font-size:1rem;
    background:var(--accent); color:#fff; border:none; font-family:inherit; cursor:pointer;
  }
  .btn.secondary{background:#fff; color:var(--accent); border:1.5px solid var(--accent);}
  #map{height:260px; border-radius:12px; border:1px solid var(--line); z-index:0;}
  .note{display:flex; gap:12px; align-items:flex-start; padding:13px 0; border-top:1px solid var(--line);}
  .note:first-child{border-top:none; padding-top:0;}
  .note .ic{font-size:1.35rem; flex:none; line-height:1.3;}
  .note .body{flex:1;}
  .note b{display:block;}
  .note p{margin:0; color:var(--muted); font-size:.96rem;}
  .card > p.plain{margin:0; color:var(--muted); font-size:.98rem;}
  .place{display:flex; gap:12px; align-items:flex-start; padding:13px 0; border-top:1px solid var(--line);}
  .place:first-of-type{border-top:none; padding-top:0;}
  .place .body{flex:1;}
  .place .nm{font-weight:700;}
  .place .walk{display:inline-block; font-size:.8rem; font-weight:700; color:var(--accent);
    background:var(--accent-soft); border-radius:999px; padding:2px 10px; margin-left:6px;}
  .place p{margin:2px 0 0; color:var(--muted); font-size:.94rem;}
  .place a{flex:none; display:flex; align-items:center; justify-content:center;
    min-height:44px; min-width:44px; padding:0 12px; border-radius:10px;
    text-decoration:none; font-size:.86rem; font-weight:700;
    color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent);}
  .em{display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--line);}
  .em:first-of-type{border-top:none; padding-top:0;}
  .em .who{flex:1; font-weight:700;}
  .em .who small{display:block; font-weight:400; color:var(--muted); font-size:.86rem;}
  .em a{flex:none; display:flex; align-items:center; min-height:44px; padding:0 16px;
    border-radius:10px; text-decoration:none; font-weight:700; font-size:1rem;
    background:var(--warn); color:#fff;}
  .em a.plainnum{background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent);}
  ol.list{margin:0; padding-left:1.3em;}
  ol.list li{margin:0 0 9px; font-size:.98rem;}
  ol.list li:last-child{margin-bottom:0;}
  footer{text-align:center; color:var(--muted); font-size:.94rem; padding:10px 10px 0;}
</style>
</head>
<body>

<header>
  <div class="langs">
    <button data-lang="ja">日本語</button>
    <button data-lang="en">EN</button>
  </div>
  <p class="kicker" id="kicker">House Guide</p>
  <h1 id="hName"></h1>
  <p class="tagline" id="hTagline"></p>
</header>

<div class="wrap" id="wrap"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
  var lang = SHIORI.defaultLang === "en" ? "en" : "ja";
  var map = null;

  function t(o){ return (o && (o[lang] || o.ja || o.en)) || ""; }
  function L_(k){ return t(LABELS[k]); }
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

  function copyRow(labelKey, value){
    return '<div class="kv"><span class="k">' + L_(labelKey) + '</span><div class="row">'
      + '<span class="v">' + esc(value) + '</span>'
      + '<button class="copy" data-copy="' + esc(value) + '">' + L_("copy") + '</button></div></div>';
  }

  function render(){
    document.documentElement.lang = lang;
    document.getElementById("hName").innerHTML = t(SHIORI.name);
    document.getElementById("hTagline").innerHTML = t(SHIORI.tagline);
    document.title = (SHIORI.name.ja || "") + " — " + (lang === "ja" ? "宿泊のしおり" : "House Guide");
    document.querySelectorAll(".langs button").forEach(function(b){
      b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
    });

    var h = "";

    // Wi-Fi
    h += '<div class="card hero"><h2><span class="ic">📶</span>' + L_("wifi") + '</h2>'
       + copyRow("ssid", SHIORI.wifi.ssid)
       + copyRow("password", SHIORI.wifi.password)
       + '<p class="plain" style="margin-top:10px">' + t(SHIORI.wifi.note) + '</p></div>';

    // 住所・行き方
    h += '<div class="card"><h2><span class="ic">📍</span>' + L_("access") + '</h2>'
       + '<p class="addr-en">' + t(SHIORI.address) + '</p>'
       + '<div class="taxi"><p class="lbl">' + L_("taxi") + '</p><div class="row">'
       + '<p class="addr-ja">' + SHIORI.address.ja + '</p>'
       + '<button class="copy" data-copy="' + esc(SHIORI.address.ja) + '">' + L_("copy") + '</button>'
       + '</div></div>'
       + '<a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination='
       + SHIORI.lat + ',' + SHIORI.lng + '">' + L_("gmaps") + '</a></div>';

    // 地図
    h += '<div class="card"><h2><span class="ic">🗺️</span>' + L_("map") + '</h2><div id="map"></div></div>';

    // チェックイン/アウト・鍵
    h += '<div class="card"><h2><span class="ic">🔑</span>' + L_("stay") + '</h2>'
       + '<div class="times">'
       + '<div class="time"><p class="lbl">' + L_("checkIn") + '</p><p class="val">' + SHIORI.checkIn + '</p></div>'
       + '<div class="time"><p class="lbl">' + L_("checkOut") + '</p><p class="val">' + SHIORI.checkOut + '</p></div>'
       + '</div>'
       + '<div class="note" style="border-top:1px solid var(--line); margin-top:14px; padding-top:14px">'
       + '<span class="ic">🗝️</span><div class="body"><b>' + L_("key") + '</b>'
       + '<p>' + t(SHIORI.keyPickup) + '</p></div></div></div>';

    // ハウスルール
    h += '<div class="card"><h2><span class="ic">📋</span>' + L_("rules") + '</h2><ol class="list">'
       + SHIORI.houseRules.map(function(r){ return "<li>" + t(r) + "</li>"; }).join("")
       + '</ol></div>';

    // 設備
    h += '<div class="card"><h2><span class="ic">🏠</span>' + L_("facilities") + '</h2>'
       + SHIORI.facilities.map(function(f){
           return '<div class="note"><span class="ic">' + f.icon + '</span><div class="body">'
             + '<b>' + t(f.title) + '</b><p>' + t(f.body) + '</p></div></div>';
         }).join("")
       + '</div>';

    // ゴミ
    h += '<div class="card"><h2><span class="ic">🗑️</span>' + L_("trash") + '</h2>'
       + '<p class="plain">' + t(SHIORI.trash) + '</p></div>';

    // 周辺
    h += '<div class="card"><h2><span class="ic">🍜</span>' + L_("nearby") + '</h2>'
       + SHIORI.nearby.map(function(p){
           var url = p.mapUrl || ("https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(p.name.ja || p.name.en));
           var walk = p.walk ? '<span class="walk">' + L_("walkMin") + " " + p.walk + L_("minSuffix") + "</span>" : "";
           return '<div class="place"><div class="body"><span class="nm">' + t(p.name) + '</span>' + walk
             + '<p>' + t(p.comment) + '</p></div>'
             + '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + L_("openMap") + '</a></div>';
         }).join("")
       + '</div>';

    // 緊急連絡先
    var em = SHIORI.emergency;
    h += '<div class="card"><h2><span class="ic">🚨</span>' + L_("emergency") + '</h2>'
       + emRow(t(em.ownerName), "", em.ownerPhone, true)
       + emRow(L_("fire"), "119", "119", false)
       + emRow(L_("police"), "110", "110", false)
       + emRow(t(em.hospital.name), L_("hospital"), em.hospital.phone, true)
       + '</div>';

    // チェックアウト
    h += '<div class="card"><h2><span class="ic">👋</span>' + L_("checkout") + '</h2><ol class="list">'
       + SHIORI.checkout.map(function(c){ return "<li>" + t(c) + "</li>"; }).join("")
       + '</ol></div>';

    h += '<footer>' + t(SHIORI.farewell) + '</footer>';

    document.getElementById("wrap").innerHTML = h;
    drawMap();
  }

  // 電話番号が未記入（数字が無い）ときは、タップできるリンクにしない
  function emRow(who, sub, phone, plain){
    var num = String(phone).replace(/[^0-9+]/g, "");
    var right = num
      ? '<a class="' + (plain ? "plainnum" : "") + '" href="tel:' + num + '">📞 ' + esc(phone) + "</a>"
      : '<span class="who" style="flex:none; color:var(--muted); font-weight:400">' + esc(phone) + "</span>";
    return '<div class="em"><div class="who">' + who + (sub ? "<small>" + sub + "</small>" : "") + "</div>" + right + "</div>";
  }

  function drawMap(){
    if (map) { map.remove(); map = null; }
    map = L.map("map", {scrollWheelZoom:false}).setView([SHIORI.lat, SHIORI.lng], 16);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);
    L.circleMarker([SHIORI.lat, SHIORI.lng], {radius:11, color:"#2e7d6b", fillColor:"#2e7d6b", fillOpacity:.9, weight:2})
      .addTo(map).bindPopup("<b>" + t(SHIORI.name) + "</b>").openPopup();
  }

  // コピーボタン
  document.addEventListener("click", function(e){
    var b = e.target.closest(".copy");
    if (!b) return;
    var text = b.dataset.copy;
    var done = function(){
      b.textContent = L_("copied"); b.classList.add("done");
      setTimeout(function(){ b.textContent = L_("copy"); b.classList.remove("done"); }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else { fallback(); }
    function fallback(){
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (err) {}
      document.body.removeChild(ta);
    }
  });

  document.querySelectorAll(".langs button").forEach(function(b){
    b.addEventListener("click", function(){ lang = b.dataset.lang; render(); });
  });

  render();
</script>
</body>
</html>
